name: Publish

on:
  push:
    branches:
      - dev
      - main

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache: a release build must not restore anything another run wrote.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine publish type
        id: publish_type
        run: |
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            echo "type=dev" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Set dev version
        if: steps.publish_type.outputs.type == 'dev'
        id: version_dev
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # Create prerelease version: 2.0.0 -> 2.0.0-dev.2025052314
          DEV_VERSION="${CURRENT%%-*}-dev.$(date +%Y%m%d%H%M%S)"
          echo "version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Dev version: $DEV_VERSION"
          # Update package.json
          node -e "const pkg=require('./package.json');pkg.version='$DEV_VERSION';require('fs').writeFileSync('./package.json',JSON.stringify(pkg,null,2)+'\n')"

      - name: Bump version
        if: steps.publish_type.outputs.type == 'release'
        id: version_release
        run: |
          # standard-version creates a commit and tag itself, so an identity
          # must be configured before it runs.
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          npx --yes standard-version@9.5.0 --release-as patch

          NEW=$(node -p "require('./package.json').version")
          echo "New version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      # The token is given to this step alone, not left in .git/config for
      # every step after checkout (dependency install scripts included).
      - name: Push version bump
        if: steps.publish_type.outputs.type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push --follow-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        if: steps.publish_type.outputs.type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_release.outputs.version }}
        run: gh release create "v${VERSION}" --title "Release v${VERSION}" --generate-notes --verify-tag

      # npm 11.5+ is needed for trusted publishing; pinned and run through npx so
      # the job never edits package.json.
      - name: Publish to npm
        env:
          PUBLISH_TYPE: ${{ steps.publish_type.outputs.type }}
        run: |
          if [[ "$PUBLISH_TYPE" == "dev" ]]; then
            npx --yes npm@12.2.2 publish --tag dev --access public --provenance
          else
            npx --yes npm@12.2.2 publish --access public --provenance
          fi
